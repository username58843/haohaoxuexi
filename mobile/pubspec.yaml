name: haohao_xuexi
description: "好好学习 — HSK vocabulary with spaced repetition."
publish_to: 'none'

# versionName+versionCode for Android releases.
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  dio: ^5.7.0
  go_router: ^16.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/words/hsk1.json
    - assets/words/hsk2.json
    - assets/words/hsk3.json
    - assets/words/hsk4.json
    - assets/words/hsk5.json
    - assets/words/hsk6.json
